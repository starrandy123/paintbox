<!doctype html>
<html><head><meta charset="utf-8"><title>bake</title></head>
<body style="margin:0;background:#111">
<canvas id="c" width="64" height="64"></canvas>
<script type="module">
import { PathTracer, makeSampleCandidates, makeSurfaceCandidates, makeShapeCandidates, makeSkySamples, boxFlagWords } from './pt.js';
import { BOXES, MAT, MAT_UV, BEACONS, GRID, UVAX, FORMS, formDomain, formFrame, shellOf } from '../game/world.js';
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
window.glInfo = { renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER), vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : '' };
let pt = null;
// the path tracer, its forms' truth sampled once (the shape pass itself needs no volumes)
let ptReady = null;
const tracerNow = () => (pt ||= new PathTracer(gl));
const tracer = () => tracerNow();
const ready = () => (ptReady ||= tracerNow().buildVolumes());
async function put(name, data) {
  const r = await fetch('/save/' + name, { method: 'PUT', body: data });
  if (!r.ok) throw new Error('save failed ' + name);
}
window.progress = 0;
// n points placed on the detailed world: candidates made a batch at a time, placed by the GPU, the ones really there kept.
// tag(mode, kind) is what each kept point carries in nrm4.w
async function placed(make, n, tag) {
  const pos4 = new Float32Array(n * 4), nrm4 = new Float32Array(n * 4);
  let have = 0, round = 0, tried = 0;
  while (have < n) {
    const W = 1024, H = Math.max(1, Math.ceil((Math.ceil((n - have) * 1.8) + 4096) / W));
    const c = make(W * H, round++);
    const out = await tracer().place(c.pos4, c.nrm4, W, H);
    tried += W * H;
    for (let i = 0; i < W * H && have < n; i++) {
      if (out.pos[i * 4 + 3] < 0.5) continue;
      pos4.set([out.pos[i * 4], out.pos[i * 4 + 1], out.pos[i * 4 + 2], c.pos4[i * 4 + 3]], have * 4);
      nrm4.set([out.nrm[i * 4], out.nrm[i * 4 + 1], out.nrm[i * 4 + 2], tag(c.nrm4[i * 4 + 3], c.kind[i])], have * 4);
      have++;
    }
    if (round > 40) throw new Error('could not place enough points: ' + have + ' of ' + n);
  }
  return { pos4, nrm4, kept: n / tried };
}
// the painter's teaching set: n points (w x h), spp paths each
window.runSamples = async ({ w, h, spp, perDraw = 4, seed = 1, tag = 'train' }) => {
  await ready();
  const t0 = performance.now();
  const { pos4, nrm4, kept } = await placed((m, k) => makeSampleCandidates(m, seed * 1000 + k), w * h, (mode) => (mode >= 0 ? 1 : 0));
  const tSample = performance.now() - t0;
  const y = await tracer().samples(pos4, nrm4, w, h, spp, perDraw, (p) => (window.progress = p));
  const tTrace = performance.now() - t0 - tSample;
  await put(`${tag}_x.f32`, new Blob([pos4, nrm4]));
  await put(`${tag}_y.f32`, new Blob([y]));
  let nan = 0; for (const v of y) if (!Number.isFinite(v)) nan++;
  const mean = [0, 0, 0]; for (let i = 0; i < w * h; i++) for (let c = 0; c < 3; c++) mean[c] += y[i * 18 + c] / (w * h);
  return { n: w * h, spp, tSample: Math.round(tSample), tTrace: Math.round(tTrace), nan, skyMean: mean, kept: +kept.toFixed(3) };
};
// the surface painter's teaching set: n points (w x h) on the detailed world's faces, spp paths each
window.runSurface = async ({ w, h, spp, perDraw = 4, seed = 1, tag = 'train' }) => {
  await ready();
  const t0 = performance.now();
  const { pos4, nrm4, kept } = await placed((m, k) => makeSurfaceCandidates(m, seed * 1000 + k), w * h, (mode, bi) => bi);
  const tSample = performance.now() - t0;
  const y = await tracer().surface(pos4, nrm4, w, h, spp, perDraw, (p) => (window.progress = p));
  const tTrace = performance.now() - t0 - tSample;
  await put(`surf_${tag}_x.f32`, new Blob([pos4, nrm4]));
  await put(`surf_${tag}_y.f32`, new Blob([y]));
  let nan = 0; for (const v of y) if (!Number.isFinite(v)) nan++;
  return { n: w * h, spp, tSample: Math.round(tSample), tTrace: Math.round(tTrace), nan, kept: +kept.toFixed(3) };
};
// the shape painter's teaching set: for every form, points of its frame and the form's truth there; all near its surface, a share of
// the rest -> data/shape_<tag>_x.f32 (x, y, z, form) and _y.f32 (the distance)
window.runShapes = async ({ n = 262144, tag = 'train', seed = 1, near = 0.12, far = 0.18 }) => {
  const t0 = performance.now(), xs = [], ys = [], counts = {};
  for (let f = 1; f < FORMS.length; f++) {
    const keepX = [], keepY = [];
    for (let round = 0; round < 2; round++) {
      const W = 1024, H = Math.ceil(n / W);
      let c4 = makeShapeCandidates(f, W * H, seed * 10 + round);
      if (round === 1) {
        // the second round: the first round's points near the surface, jittered by a centimetre or two
        const nearPts = []; for (let i = 0; i < keepY.length; i++) if (Math.abs(keepY[i]) < 0.04) nearPts.push(i);
        let s = (seed * 31 + f) >>> 0; const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
        const g = () => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(6.2831853 * r());
        const dom = formDomain(f);
        for (let i = 0; i < W * H && nearPts.length; i++) {
          const j = nearPts[Math.floor(r() * nearPts.length)];
          for (let a = 0; a < 3; a++) { let v = keepX[j * 4 + a] + g() * 0.015; if (dom[a].wrap) v = ((v - dom[a].lo) % (dom[a].hi - dom[a].lo) + (dom[a].hi - dom[a].lo)) % (dom[a].hi - dom[a].lo) + dom[a].lo; else v = Math.min(dom[a].hi, Math.max(dom[a].lo, v)); c4[i * 4 + a] = v; }
        }
      }
      const d = await tracer().shapeTruth(c4, W, H);
      let s2 = (seed * 977 + f * 13 + round) >>> 0; const r2 = () => ((s2 = (s2 * 1664525 + 1013904223) >>> 0) / 4294967296);
      for (let i = 0; i < W * H; i++) {
        if (!(Math.abs(d[i]) < near || r2() < far)) continue;
        keepX.push(c4[i * 4], c4[i * 4 + 1], c4[i * 4 + 2], f); keepY.push(d[i]);
      }
    }
    counts[FORMS[f].name] = keepY.length;
    xs.push(new Float32Array(keepX)); ys.push(new Float32Array(keepY));
    window.progress = f / (FORMS.length - 1);
  }
  await put(`shape_${tag}_x.f32`, new Blob(xs));
  await put(`shape_${tag}_y.f32`, new Blob(ys));
  return { forms: FORMS.length - 1, counts, ms: Math.round(performance.now() - t0) };
};
// the sky painter's teaching set
window.runSky = async ({ w, h, seed = 1, tag = 'train' }) => {
  const t0 = performance.now();
  const dirs4 = makeSkySamples(w * h, seed);
  const y = await tracer().sky(dirs4, w, h);
  await put(`sky_${tag}_x.f32`, new Blob([dirs4]));
  await put(`sky_${tag}_y.f32`, new Blob([y]));
  return { n: w * h, ms: Math.round(performance.now() - t0) };
};
// what the trainers need to know about the world (the same facts the game builds its faces from)
window.runBoxes = async () => {
  const boxes = BOXES.map((b) => ({ min: b.min, max: b.max, m: b.m, e: b.e, glow: b.glow, flags: boxFlagWords(b), form: b.form, swap: shellOf(b).swap }));
  const mats = MAT.map((m) => ({ name: m[0], uv: MAT_UV[m[0]], proxy: m[2] }));
  const forms = FORMS.map((fm, i) => ({ name: fm.name, cell: fm.cell || 0, axes: fm.axes || null, domain: i ? formDomain(i) : null }));
  await put('boxes.json', new Blob([JSON.stringify({ boxes, mats, forms, uvax: UVAX, beacons: BEACONS, grid: GRID })]));
  const crystals = BEACONS.map((_, k) => { const b = BOXES.find((x) => x.e === k); return [b.min, b.max]; });
  await put('grid.json', new Blob([JSON.stringify({ ...GRID, crystals })]));
  return { boxes: boxes.length };
};
// a path-traced picture from a camera
window.runCamera = async ({ invViewProj, eye, w, h, t, beaconLight, glow, spp, perDraw = 4, name }) => {
  await ready();
  const t0 = performance.now();
  canvas.width = w; canvas.height = h;
  const px = await tracer().camera({ invViewProj, eye, w, h, t, beaconLight, glow: glow || new Array(15).fill(0), spp, perDraw, onProgress: (p) => (window.progress = p) });
  const c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
  const ctx = c2.getContext('2d'), img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) img.data.set(px.subarray((h - 1 - y) * w * 4, (h - y) * w * 4), y * w * 4);
  ctx.putImageData(img, 0, 0);
  const blob = await new Promise((ok) => c2.toBlob(ok, 'image/png'));
  await put(name, blob);
  return { ms: Math.round(performance.now() - t0) };
};
window.ready = true;
</script>
</body></html>
